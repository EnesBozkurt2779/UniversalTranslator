name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
         
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "flutter.sdk=$ANDROID_HOME" >> local.properties

    - name: Build with Gradle
      uses: gradle/gradle-build-action@v2
      with:
        arguments: :app:assembleDebug --no-daemon

    - name: List APK outputs
      run: |
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "APK dir not found"
        find . -name "*.apk" -type f 2>/dev/null | head -10

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: universal-translator.apk
        path: app/build/outputs/apk/debug/*.apk